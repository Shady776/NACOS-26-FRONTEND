<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- TODO: Set the document title to the name of your application -->
    <title>Nacos Connect '26 V1 </title>
    <meta name="description" content="Nacos Nexus Project" />
    <meta name="author" content="Nacos Nexus" />

    <!-- TODO: Update og:title to match your application name -->
    <meta property="og:title" content="Nacos Nexus" />
    <meta property="og:description" content="Nacos Nexus Project" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@nacos_nexus" />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Set theme class before React mounts to avoid a flash of the wrong theme -->
    <script>
      (function () {
        const stored = localStorage.getItem("theme");
        const theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.classList.add(theme);
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
